<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL FOR MOBILE: Sets the viewport width to match the device screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Menu -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content Grid (Two Columns on Desktop) -->
    <div class="main-container">
        <main class="content-area">
            <h1>Welcome to Our Responsive Site</h1>
            <p>This layout automatically adapts to smaller screens using CSS Flexbox and Media Queries.</p>
            
            <!-- Large Fluid Image Container -->
            <div class="image-wrapper">
                <img src="https://placeholder.com" alt="Placeholder Image">
            </div>
        </main>
        
        <aside class="sidebar">
            <h3>Sidebar Features</h3>
            <ul>
                <li>Latest Updates</li>
                <li>Trending Topics</li>
                <li>Useful Resources</li>
            </ul>
        </aside>
    </div>

</body>
</html>
